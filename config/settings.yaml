# stock_analysis 全局配置

# 数据源
data_provider: tushare  # tushare | akshare
tushare:
  timeout: 30
  retry_count: 3
  retry_delay: 1.0

akshare:
  timeout: 30
  retry_count: 3

# 官方公告事件 / 情绪来源（不替代 Tushare 基本面主源）
cninfo:
  enabled: true
  base_url: https://www.cninfo.com.cn
  static_base_url: https://static.cninfo.com.cn
  timeout: 30
  page_size: 30
  max_pages: 20
  lookback_days: 365
  include_hk: false

# 缓存
cache:
  enabled: true
  ttl_daily: 86400       # 日线缓存 TTL（秒），默认 24 小时
  ttl_adjustment_factors: 86400 # 复权因子缓存 TTL（秒），默认 24 小时
  ttl_financials: 604800 # 财务数据缓存 TTL（秒），默认 7 天

# 分析参数
analysis:
  ma_periods: [5, 10, 20, 60]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_period: 20
  bollinger_std: 2.0
  kdj_n: 9
  kdj_m1: 3
  kdj_m2: 3

# 估值
valuation:
  percentile_windows: [1, 3, 5]  # 分位计算窗口（年）

# 批量并发与限频
batch:
  max_workers: 1               # 数据/分析并发，默认 1 保持串行；CLI --workers 可覆盖
  request_min_interval_s: 0.05 # 供应商请求最小间隔（~20 req/s 客户端保守上限）
  llm_max_concurrent: 1        # LLM 调用并发上限（成本控制，默认串行）

# LLM
llm:
  default_mode: quick  # quick | deep | value
  max_tokens: 4000
  temperature: 0.3

# 报告
report:
  output_dir: output/reports
  json_dir: output/json
