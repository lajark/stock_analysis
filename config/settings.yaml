# stock_analysis 全局配置

# 数据源
data_provider: tushare  # tushare | akshare
tushare:
  timeout: 30
  retry_count: 3
  retry_delay: 1.0

akshare:
  timeout: 30
  retry_count: 3

# 缓存
cache:
  enabled: true
  ttl_daily: 86400       # 日线缓存 TTL（秒），默认 24 小时
  ttl_financials: 604800 # 财务数据缓存 TTL（秒），默认 7 天

# 分析参数
analysis:
  ma_periods: [5, 10, 20, 60]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_period: 20
  bollinger_std: 2.0
  kdj_n: 9
  kdj_m1: 3
  kdj_m2: 3

# 估值
valuation:
  percentile_windows: [1, 3, 5]  # 分位计算窗口（年）

# LLM
llm:
  default_mode: quick  # quick | deep | value
  max_tokens: 2000
  temperature: 0.3

# 报告
report:
  output_dir: output/reports
  json_dir: output/json