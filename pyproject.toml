[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock_analysis"
version = "1.4.0"
description = "个人股票分析工具 — 本地计算为主，LLM 仅用于报告生成"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tushare>=1.4.0",
    "akshare>=1.14.0",
    "duckdb>=1.0.0",
    "pyarrow>=14.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "plotly>=5.0.0",
    "ttkbootstrap>=2.2.0",
    "markdown>=3.6",
    "tkinterweb>=4.1",
    "pywebview>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
stock-analysis = "src.app.cli:app"
stock-analysis-gui = "src.app.webgui.app:main"
stock-analysis-gui-legacy = "src.app.gui:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: real-provider/network contract tests; opt-in (set TUSHARE_TOKEN or run with -m integration)",
    "network: tests that perform real network access",
]
