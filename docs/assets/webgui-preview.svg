  <text x="792" y="455" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0f172a">2026-08-14</text>
  <rect x="986" y="392" width="198" height="90" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1010" y="422" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#64748b">报告模式</text>
  <text x="1010" y="455" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0f172a">quick</text>
  <rect x="550" y="514" width="634" height="86" rx="14" fill="#111827"/>
